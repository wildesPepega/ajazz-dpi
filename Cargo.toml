[package]
name = "ajazz-dpi"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "DPI, polling rate and battery tray for the Ajazz AJ159P mouse on Linux"
repository = "https://github.com/wildesPepega/ajazz-dpi"

[dependencies]
ab_glyph = "0.2.32"
eframe = { version = "0.37.0", default-features = false, features = ["glow", "wayland", "x11", "default_fonts"] }
ksni = { version = "0.3.7", default-features = false, features = ["async-io", "blocking"] }
libc = "0.2.191"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
